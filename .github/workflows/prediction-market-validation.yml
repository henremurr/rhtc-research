name: Prediction Market Validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RHTC_DATA_DIR: ${{ runner.temp }}/rhtc-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate prediction dashboard JavaScript
        run: node --check app/options/static/prediction_markets.js
      - name: Compile application
        run: python -m compileall -q app main.py tests
      - name: Prediction market regression tests
        run: python -m unittest discover -s tests -p 'test_prediction_markets.py' -v
      - name: Application import and authenticated route registration
        run: |
          python - <<'PY'
          from main import app
          from app.options.api import app as options
          paths = {route.path for route in options.routes}
          assert '/api/prediction-markets' in paths
          assert '/api/prediction-markets/refresh' in paths
          assert '/prediction-markets' in paths
          print('Prediction market routes registered')
          PY
      - name: Live read-only provider contract smoke test
        run: |
          python - <<'PY'
          import httpx
          from app.options.prediction_markets import URL, normalize
          with httpx.Client(timeout=30) as client:
              params = {'active':'true','closed':'false','limit':2,'order':'id','ascending':'true'}
              r = client.get(URL, params=params)
              r.raise_for_status()
              first = r.json()
              assert isinstance(first.get('markets'),list) and first['markets']
              assert first.get('next_cursor'), 'Expected cursor for next page'
              r = client.get(URL, params={**params,'after_cursor':first['next_cursor']})
              r.raise_for_status()
              second = r.json()
              assert second.get('markets'), 'Expected second page'
              for page in (first,second):
                  assert all(m.get('active') is True and m.get('closed') is False for m in page['markets'])
              assert {normalize(m)['id'] for m in first['markets']}.isdisjoint({normalize(m)['id'] for m in second['markets']})
          print('Live provider schema and two-page pagination verified')
          PY
