name: Prediction regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m unittest discover -s tests -p test_prediction_markets.py -v
      - run: python -m unittest discover -s tests -p test_forward_intelligence.py -v
      - name: Open tax lot deletion integrity regression tests
        run: python -m unittest discover -s tests -p test_open_lot_safeguards.py -v
      - name: Kalshi and cross-provider regression tests
        run: |
          python -m unittest discover -s tests -p 'test_kalshi*.py' -v
          python -m unittest discover -s tests -p test_prediction_comparison.py -v
      - run: node --check app/options/static/prediction_markets.js
      - run: node --check app/options/static/app.js
      - run: python -m app.options.prediction_execution_audit
