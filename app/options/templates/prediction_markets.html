<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RHTC Prediction Market Intelligence</title><style>
:root{color-scheme:dark;--bg:#111418;--panel:#1c2127;--ink:#e7eaf0;--muted:#b4bac4;--gold:#d4b66b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:16px 16px 100px}header{display:flex;gap:12px;align-items:center}header img{width:52px;height:52px}h1{font-size:clamp(19px,4vw,27px)}h2{font-size:18px}p{line-height:1.5}button,a.action{border:1px solid var(--gold);background:var(--gold);color:#151515;border-radius:7px;padding:10px 12px;font:600 14px system-ui;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}select,input{min-height:44px;background:var(--panel);color:var(--ink);border:1px solid #69717d;border-radius:6px;padding:8px;font:inherit;max-width:100%}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.controls input{flex:1;min-width:130px}article{background:var(--panel);border:1px solid #414952;border-radius:9px;padding:14px;margin:12px 0;overflow-wrap:anywhere}article h2{margin:0 0 10px}article p{margin:7px 0}.muted,small{color:var(--muted)}.float{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid #555;padding:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}details{margin-top:10px}summary{cursor:pointer;font-weight:600}a{color:var(--gold)}@media print{body{background:white;color:black}article{background:white;color:black;break-inside:avoid}.float,.controls{display:none}.muted,small{color:#444}}</style></head><body><main><header><h1>RHTC Prediction Market Intelligence</h1></header><p class="muted">Read-only research. Market-implied probabilities and AI-generated company associations are unverified complementary evidence, not trade signals. Recorded positions are not a reconciled brokerage statement.</p><div class="controls"><select id="topic" aria-label="Thesis"><option>All</option><option>AI/I</option><option>EFM/I</option><option>DS/I</option><option>Human Economy</option><option>Macro</option><option>Unclassified</option></select><select id="exposure" aria-label="Exposure"><option>All</option><option>Holdings</option><option>Watchlist</option><option>Emerging</option></select><input id="search" placeholder="Search markets or tickers" aria-label="Search"><button id="apply">Apply filters</button></div><p id="status" role="status" aria-live="polite">Loading…</p><div id="rows"></div><div class="controls"><button id="prev">Previous</button><button id="next">Next</button></div></main><nav class="float"><button id="refresh">Refresh markets</button><button id="reload">Reload results</button><button id="print">Print or save PDF</button><a class="action" href="/options/">Return to dashboard</a></nav><script>
'use strict';
const el=id=>document.getElementById(id),pageSize=50;let offset=0,total=0,serial=0;
function line(parent,label,value){if(value===null||value===undefined||value===''||Array.isArray(value)&&!value.length)return;const p=document.createElement('p'),b=document.createElement('strong');b.textContent=label+': ';p.append(b,document.createTextNode(String(value)));parent.append(p)}
const pct=n=>Number.isFinite(n)?(n*100).toFixed(1)+'%':'Unavailable';
function render(m){const a=document.createElement('article'),h=document.createElement('h2');h.textContent=m.title;a.append(h);line(a,'Classification',m.topics.join(' · ')||'Unclassified');line(a,'Market-implied probabilities',Object.entries(m.probabilities).map(([k,v])=>k+' '+pct(v)).join(' · ')||'Unavailable');line(a,'Relevance',m.relevance===null?'Semantic review pending':m.relevance+'/10');line(a,'Market quality',m.quality);line(a,'Liquidity / 24h volume',String(m.liquidity??'Unavailable')+' / '+String(m.volume24h??'Unavailable'));line(a,'Bid-ask spread',pct(m.spread));for(const d of ['1','7','30'])line(a,d+'-day change',Object.entries(m.changes_pp?.[d]||{}).map(([k,v])=>k+' '+(v>0?'+':'')+v+' pp').join(' · ')||'Insufficient history');line(a,'Event end date',m.end_date);line(a,'Watchlist research candidates',m.watchlist_matches);line(a,'Outside-watchlist candidates (unverified)',m.outside_candidates);line(a,'Recorded holdings possibly affected',m.holdings.map(x=>x.symbol+' — '+(x.account||'Unassigned')+' — '+x.quantity+' shares'+(x.call_expiration?' — call expiry '+x.call_expiration:'')+(x.additional_calls?.length?' — '+x.additional_calls.length+' additional call records':'')));line(a,'Broad thematic exposure (not direct links)',m.thematic_exposure);if(m.research){line(a,'Company research candidates',m.research.companies);line(a,'Opportunity hypothesis',m.research.opportunity);line(a,'Risk hypothesis',m.research.risk);line(a,'Independent confirmation required',m.research.confirmation);line(a,'Resolution clarity (AI assessment)',m.research.resolution_clarity)}const d=document.createElement('details'),s=document.createElement('summary');s.textContent='Resolution rules and source';d.append(s);line(d,'Rules',m.description||'Unavailable');line(d,'Resolution source',m.resolution_source||'Unavailable');line(d,'Provider market ID',m.id);if(m.slug&&/^[a-zA-Z0-9_-]+$/.test(m.slug)){const link=document.createElement('a');link.href='https://polymarket.com/market/'+m.slug;link.textContent='Original market reference';link.target='_blank';link.rel='noopener noreferrer';d.append(link)}a.append(d);return a}
async function load(){const request=++serial;el('status').textContent='Loading saved research…';try{const params=new URLSearchParams({topic:el('topic').value,exposure:el('exposure').value,q:el('search').value,offset,limit:pageSize});const r=await fetch('/options/api/prediction-markets?'+params,{cache:'no-store'});if(!r.ok)throw Error('Unable to retrieve market research ('+r.status+')');const data=await r.json();if(request!==serial)return;total=data.count;el('rows').replaceChildren(...data.markets.map(render));el('status').textContent=(data.scan?'Last complete scan: '+new Date(data.scan.stamp).toLocaleString()+' · '+data.scan.count+' markets discovered · '+data.reviewed+' semantically reviewed · Showing '+(total?offset+1:0)+'–'+Math.min(offset+pageSize,total)+' of '+total:'No completed scan yet')+(data.scanning?' · Scan running':'')+(data.reviewing?' · Semantic review running':'');el('prev').disabled=offset===0;el('next').disabled=offset+pageSize>=total}catch(e){if(request===serial)el('status').textContent=e.message}}
el('apply').onclick=()=>{offset=0;load()};el('prev').onclick=()=>{offset=Math.max(0,offset-pageSize);load()};el('next').onclick=()=>{if(offset+pageSize<total){offset+=pageSize;load()}};el('reload').onclick=load;el('print').onclick=()=>window.print();el('refresh').onclick=async()=>{el('refresh').disabled=true;try{const r=await fetch('/options/api/prediction-markets/refresh',{method:'POST'});if(!r.ok)throw Error('Refresh unavailable ('+r.status+')');el('status').textContent='Scan queued. Previously saved data remains available.';setTimeout(load,2000)}catch(e){el('status').textContent=e.message}finally{el('refresh').disabled=false}};load();setInterval(()=>{if(!document.hidden)load()},60000);
</script></body></html>
